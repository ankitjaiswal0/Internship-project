<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Secure Login</title>
    <style>
      :root {
        --primary: #2563eb;
        --primary-dark: #1d4ed8;
        --text: #0f172a;
        --muted: #64748b;
        --border: #e2e8f0;
        --bg: #f8fafc;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Segoe UI", Roboto, Arial, sans-serif;
        background: linear-gradient(135deg, #eef2ff 0%, #f8fafc 100%);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: rgba(255, 255, 255, 0.95);
        border: 1px solid var(--border);
        border-radius: 20px;
        box-shadow: 0 20px 45px rgba(15, 23, 42, 0.12);
        padding: 32px;
        backdrop-filter: blur(8px);
      }
      .brand {
        display: inline-block;
        padding: 8px 12px;
        border-radius: 999px;
        background: #eff6ff;
        color: var(--primary-dark);
        font-size: 0.82rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        margin-bottom: 14px;
      }
      h2 {
        margin: 0 0 8px;
        font-size: 1.7rem;
      }
      .subtitle {
        margin: 0 0 20px;
        color: var(--muted);
        font-size: 0.95rem;
      }
      .alert {
        padding: 12px 14px;
        margin-bottom: 16px;
        border-radius: 10px;
        font-size: 0.95rem;
      }
      .alert.success {
        background: #ecfdf3;
        color: #047857;
      }
      .alert.danger {
        background: #fef2f2;
        color: #b91c1c;
      }
      .alert.info {
        background: #eff6ff;
        color: #1d4ed8;
      }
      form {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      label {
        font-size: 0.9rem;
        font-weight: 600;
        color: var(--text);
      }
      input {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid var(--border);
        border-radius: 12px;
        font-size: 0.96rem;
        outline: none;
        transition:
          border-color 0.2s ease,
          box-shadow 0.2s ease;
      }
      input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
      }
      button {
        padding: 12px 14px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(
          135deg,
          var(--primary) 0%,
          var(--primary-dark) 100%
        );
        color: white;
        font-weight: 700;
        cursor: pointer;
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease;
        box-shadow: 0 10px 20px rgba(37, 99, 235, 0.2);
      }
      button:hover {
        transform: translateY(-1px);
      }
      .footer {
        margin-top: 18px;
        text-align: center;
        color: var(--muted);
        font-size: 0.95rem;
      }
      a {
        color: var(--primary);
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="brand">Secure Access</div>
      <h2>Welcome back</h2>
      <p class="subtitle">Sign in to continue to your protected workspace.</p>
      {% with messages = get_flashed_messages(with_categories=true) %} {% if
      messages %} {% for category, message in messages %}
      <div class="alert {{ category }}">{{ message }}</div>
      {% endfor %} {% endif %} {% endwith %}
      <form method="post">
        <label for="username">Username</label>
        <input
          id="username"
          type="text"
          name="username"
          placeholder="Enter your username"
          required
        />
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          name="password"
          placeholder="Enter your password"
          required
        />
        <button type="submit">Log In</button>
      </form>
      <div class="footer">
        <p>
          Need an account? <a href="{{ url_for('register') }}">Create one</a>
        </p>
      </div>
    </div>
  </body>
</html>
